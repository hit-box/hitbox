[package]
name = "hitbox-reqwest"
version = "0.2.0"
authors.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
categories = [
    "caching",
    "asynchronous",
    "network-programming",
    "web-programming",
]
description = "Client-side HTTP response caching for reqwest via reqwest-middleware, powered by Hitbox."
readme = "README.md"
keywords = ["cache", "reqwest", "async", "http", "middleware"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
hitbox = { path = "../hitbox", version = "0.2" }
hitbox-core = { path = "../hitbox-core", version = "0.2" }
hitbox-backend = { path = "../hitbox-backend", version = "0.2" }
hitbox-http = { path = "../hitbox-http", version = "0.2" }

reqwest = { version = "0.13", default-features = false }
reqwest-middleware = "0.5"
async-trait = { workspace = true }
http = { workspace = true }
http-body-util = { workspace = true }
bytes = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
hitbox-moka = { path = "../hitbox-moka", version = "0.2" }
wiremock = "0.6"
serde_json = { workspace = true }
