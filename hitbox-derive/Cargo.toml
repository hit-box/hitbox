[package]
name = "hitbox-derive"
version = "0.2.1"
description = "Derive macros (#[cached], CacheableRequest, CacheableResponse) for the Hitbox caching framework."
keywords = ["cache", "derive", "macro", "memoization", "async"]
categories = ["caching", "development-tools::procedural-macro-helpers"]
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full", "parsing", "extra-traits"] }
darling = "0.23"
convert_case = "0.11"
