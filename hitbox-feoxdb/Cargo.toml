[package]
name = "hitbox-feoxdb"
version = "0.2.1"
authors.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
categories.workspace = true
description = "FeOxDB backend for Hitbox cache with per-key TTL support"
readme = "README.md"
keywords = ["cache", "backend", "feoxdb", "embedded", "hitbox"]

[dependencies]
# Hitbox dependencies
hitbox-backend = { path = "../hitbox-backend", version = "0.2" }
hitbox-core = { path = "../hitbox-core", version = "0.2" }

# FeOxDB - Pure Rust embedded DB with TTL
# Below 0.5.3, which deadlocks on a full data file: https://github.com/hit-box/hitbox/issues/295
feoxdb = ">=0.5.1, <0.5.3"

# Async support
async-trait.workspace = true
tokio = { workspace = true, features = ["sync", "rt"] }

# Time handling
chrono.workspace = true

# Serialization
serde = { workspace = true }
serde_bytes = "0.11"
bincode.workspace = true
bytes = { workspace = true }

# Error handling
thiserror.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }
tempfile = "3"
